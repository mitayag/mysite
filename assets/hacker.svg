<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Hacker">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#16223a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="26" fill="url(#bg)"/>
  <rect x="7" y="7" width="186" height="186" rx="21" fill="none" stroke="#2b3f66" stroke-width="2"/>

  <!-- shoulders / body -->
  <path d="M40 200 L40 174 C 40 152 64 142 100 142 C 136 142 160 152 160 174 L 160 200 Z" fill="#16223a"/>

  <!-- hood -->
  <path d="M100 36 C 60 36 42 76 40 118 C 40 126 47 131 55 127 C 57 106 68 88 100 88 C 132 88 143 106 145 127 C 153 131 160 126 160 118 C 158 76 140 36 100 36 Z" fill="#1e2c49"/>

  <!-- face shadow -->
  <ellipse cx="100" cy="103" rx="25" ry="21" fill="#080c17"/>

  <!-- glowing eyes -->
  <g filter="url(#glow)">
    <circle cx="90" cy="99" r="4.5" fill="#22d3ee"/>
    <circle cx="110" cy="99" r="4.5" fill="#22d3ee"/>
  </g>

  <!-- binary accents -->
  <text x="14" y="50" font-family="monospace" font-size="11" fill="#22d3ee" opacity="0.6">0110</text>
  <text x="14" y="64" font-family="monospace" font-size="11" fill="#22d3ee" opacity="0.35">1001</text>
  <text x="150" y="180" font-family="monospace" font-size="11" fill="#a78bfa" opacity="0.6">1101</text>
  <text x="150" y="194" font-family="monospace" font-size="11" fill="#a78bfa" opacity="0.35">0010</text>
</svg>
